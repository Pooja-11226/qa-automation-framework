name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-automation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck

      - name: Install Playwright browser and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Configure environment
        # The SauceDemo accounts are public demo credentials.
        # For a real system, map repository secrets to environment variables here.
        run: cp .env.example .env

      - name: Run UI tests
        run: npx playwright test

      - name: Publish HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui-automation/playwright-report/
          retention-days: 14

      - name: Upload failure evidence (screenshots, videos, traces) and JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: ui-automation/test-results/
          retention-days: 14

  api-tests:
    name: API tests (REST Assured)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run API tests
        env:
         API_USERNAME: ${{ secrets.API_USERNAME }}
         API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: mvn -B -ntp clean test

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: mvn -B -ntp allure:report

      - name: Publish Allure report, Surefire reports and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            api-automation/target/site/allure-maven-plugin/
            api-automation/target/surefire-reports/
            api-automation/target/logs/
          retention-days: 14

  api-known-defects:
    name: API known-defect status (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # These tests assert correct behaviour for defects in the demo API
    # and are expected to fail. They report defect status without
    # blocking the pipeline.
    continue-on-error: true

    defaults:
      run:
        working-directory: api-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run known-defect tests
        run: mvn -B -ntp clean test -Pknown-defects

      - name: Publish Surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-known-defects-reports
          path: api-automation/target/surefire-reports/
          retention-days: 14
