# Non-secret settings for the "qa" environment (select with -Denv=qa or API_ENV=qa).
# Credentials are NOT stored here; provide API_USERNAME / API_PASSWORD via .env, env vars or -D properties.
api.base.uri=https://restful-booker.herokuapp.com
api.connect.timeout.ms=15000
# The free-tier host can take several seconds to wake up.
api.read.timeout.ms=30000
api.healthcheck.enabled=true
